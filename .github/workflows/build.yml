name: Build

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'ci skip') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025-vs2026]
        arch: [x86, x64, arm64]
        config: [Debug, Release]
        include:
          - os: windows-2022
            vs: Visual Studio 2022
          - os: windows-2025-vs2026
            vs: Visual Studio 2026

    name: ${{ matrix.os }} / ${{ matrix.vs }} / ${{ matrix.arch }} ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: external/canokey-pkcs11/cmake/tf-psa-crypto-generator-requirements.txt

      - name: Install TF-PSA-Crypto generator requirements
        shell: pwsh
        run: >
          python -m pip install --disable-pip-version-check
          --prefer-binary -r external/canokey-pkcs11/cmake/tf-psa-crypto-generator-requirements.txt

      - name: Build ${{ matrix.arch }} ${{ matrix.config }}
        shell: pwsh
        run: |
          $python = python -c "import sys; print(sys.executable)"
          .\build.ps1 -Arch "${{ matrix.arch }}" -Config "${{ matrix.config }}" -Python3Executable $python
          if ($LASTEXITCODE -ne 0) { throw "Build failed for ${{ matrix.arch }} ${{ matrix.config }}" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: canokey-mini-driver-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.config }}
          if-no-files-found: error
          path: |
            out/build/**/canokey-minidriver.dll
            out/build/**/canokey-minidriver.inf
