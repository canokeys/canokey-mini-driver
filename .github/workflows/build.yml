name: Build

on:
  push:
  pull_request:
    branches: [master]

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2019, windows-2022]
        include:
          - os: windows-2019
            cmake-config-args: '-G "Visual Studio 16 2019"'
          - os: windows-2022
            cmake-config-args: '-G "Visual Studio 17 2022"'

    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Configure
        run: cmake -S . -B build -T ClangCL -A x64 ${{ matrix.cmake-config-args }}
      - name: Build
        run: cmake --build build -v
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: canokey-mini-driver-${{ matrix.os }}
          path: |
            build/**/canokey-minidriver.*
