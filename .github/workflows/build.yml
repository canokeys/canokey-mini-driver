name: Build

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'ci skip') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows Server 2022 / Visual Studio 2022
            os: windows-2022
          - name: Windows Server 2025 / Visual Studio 2022
            os: windows-2025
          - name: Windows Server 2025 / Visual Studio 2026
            os: windows-2025-vs2026

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: external/canokey-pkcs11/cmake/tf-psa-crypto-generator-requirements.txt

      - name: Install TF-PSA-Crypto generator requirements
        shell: pwsh
        run: >
          python -m pip install --disable-pip-version-check
          --prefer-binary -r external/canokey-pkcs11/cmake/tf-psa-crypto-generator-requirements.txt

      - name: Build x64 Debug
        shell: pwsh
        run: .\build.ps1 -Arch x64 -Config Debug -VerboseBuild

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: canokey-mini-driver-${{ matrix.os }}
          if-no-files-found: error
          path: |
            out/build/**/canokey-minidriver.dll
            out/build/**/canokey-minidriver.inf
