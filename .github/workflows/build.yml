name: Build

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'ci skip') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows Server 2022 / Visual Studio 2022
            os: windows-2022
            arch: x64
          - name: Windows Server 2022 / Visual Studio 2022 / ARM64
            os: windows-2022
            arch: arm64
          - name: Windows Server 2025 / Visual Studio 2026
            os: windows-2025-vs2026
            arch: x64
          - name: Windows Server 2025 / Visual Studio 2026 / ARM64
            os: windows-2025-vs2026
            arch: arm64

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: external/canokey-pkcs11/cmake/tf-psa-crypto-generator-requirements.txt

      - name: Install TF-PSA-Crypto generator requirements
        shell: pwsh
        run: >
          python -m pip install --disable-pip-version-check
          --prefer-binary -r external/canokey-pkcs11/cmake/tf-psa-crypto-generator-requirements.txt

      - name: Build x64 Debug
        shell: pwsh
        run: |
          $python = python -c "import sys; print(sys.executable)"
          .\build.ps1 -Arch $env:TARGET_ARCH -Config Debug -VerboseBuild -Python3Executable $python
        env:
          TARGET_ARCH: ${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: canokey-mini-driver-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            out/build/**/canokey-minidriver.dll
            out/build/**/canokey-minidriver.inf
