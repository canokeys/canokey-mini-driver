name: Build

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'ci skip') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: Windows Server 2022 / Visual Studio 2022
            suffix: vs2022
          - os: windows-2025-vs2026
            name: Windows Server 2025 / Visual Studio 2026
            suffix: vs2026

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: external/canokey-pkcs11/cmake/tf-psa-crypto-generator-requirements.txt

      - name: Install TF-PSA-Crypto generator requirements
        shell: pwsh
        run: >
          python -m pip install --disable-pip-version-check
          --prefer-binary -r external/canokey-pkcs11/cmake/tf-psa-crypto-generator-requirements.txt

      - name: Build x86 Debug
        shell: pwsh
        run: |
          $python = python -c "import sys; print(sys.executable)"
          .\build.ps1 -Arch x86 -Config Debug -Python3Executable $python
          if ($LASTEXITCODE -ne 0) { throw "Build failed for x86 Debug" }

      - name: Build x86 Release
        shell: pwsh
        run: |
          $python = python -c "import sys; print(sys.executable)"
          .\build.ps1 -Arch x86 -Config Release -Python3Executable $python
          if ($LASTEXITCODE -ne 0) { throw "Build failed for x86 Release" }

      - name: Build x64 Debug
        shell: pwsh
        run: |
          $python = python -c "import sys; print(sys.executable)"
          .\build.ps1 -Arch x64 -Config Debug -Python3Executable $python
          if ($LASTEXITCODE -ne 0) { throw "Build failed for x64 Debug" }

      - name: Build x64 Release
        shell: pwsh
        run: |
          $python = python -c "import sys; print(sys.executable)"
          .\build.ps1 -Arch x64 -Config Release -Python3Executable $python
          if ($LASTEXITCODE -ne 0) { throw "Build failed for x64 Release" }

      - name: Build ARM64 Debug
        shell: pwsh
        run: |
          $python = python -c "import sys; print(sys.executable)"
          .\build.ps1 -Arch arm64 -Config Debug -Python3Executable $python
          if ($LASTEXITCODE -ne 0) { throw "Build failed for ARM64 Debug" }

      - name: Build ARM64 Release
        shell: pwsh
        run: |
          $python = python -c "import sys; print(sys.executable)"
          .\build.ps1 -Arch arm64 -Config Release -Python3Executable $python
          if ($LASTEXITCODE -ne 0) { throw "Build failed for ARM64 Release" }

      - name: Build ARM64X Debug forwarder
        shell: pwsh
        run: |
          $python = python -c "import sys; print(sys.executable)"
          .\build.ps1 -Arch arm64x -Config Debug -Python3Executable $python
          if ($LASTEXITCODE -ne 0) { throw "Build failed for ARM64X Debug" }

      - name: Build ARM64X Release forwarder
        shell: pwsh
        run: |
          $python = python -c "import sys; print(sys.executable)"
          .\build.ps1 -Arch arm64x -Config Release -Python3Executable $python
          if ($LASTEXITCODE -ne 0) { throw "Build failed for ARM64X Release" }

      - name: Stage Debug artifact
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "artifact-staging\debug"
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          foreach ($arch in @("x86", "x64", "arm64", "arm64x")) {
            $source = Join-Path $env:GITHUB_WORKSPACE "out\build\$arch-Clang-Debug"
            $stem = "canokey-minidriver-$arch"
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            Copy-Item -LiteralPath (Join-Path $source "canokey-minidriver.dll") -Destination (Join-Path $stage "$stem.dll")
          }
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "out\build\arm64x-Clang-Debug\canokey-minidriver.inf") -Destination (Join-Path $stage "canokey-minidriver.inf")

      - name: Stage Release artifact
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "artifact-staging\release"
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          foreach ($arch in @("x86", "x64", "arm64", "arm64x")) {
            $source = Join-Path $env:GITHUB_WORKSPACE "out\build\$arch-Clang-Release"
            $stem = "canokey-minidriver-$arch"
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            Copy-Item -LiteralPath (Join-Path $source "canokey-minidriver.dll") -Destination (Join-Path $stage "$stem.dll")
          }
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "out\build\arm64x-Clang-Release\canokey-minidriver.inf") -Destination (Join-Path $stage "canokey-minidriver.inf")

      - name: Upload Debug staging artifact
        uses: actions/upload-artifact@v7
        with:
          name: canokey-mini-driver-debug-${{ matrix.suffix }}
          if-no-files-found: error
          path: artifact-staging/debug

      - name: Upload Release staging artifact
        uses: actions/upload-artifact@v7
        with:
          name: canokey-mini-driver-release-${{ matrix.suffix }}
          if-no-files-found: error
          path: artifact-staging/release
